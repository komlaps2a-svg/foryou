<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Smart Gesture Camera V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #ff69b4;
            --surface: rgba(15, 23, 42, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100dvh; /* Dynamic viewport fix untuk mobile */
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            will-change: transform, filter;
        }

        /* Filter Core */
        .blur-active { filter: blur(15px) brightness(0.9); }
        .filter-sepia { filter: sepia(0.8); }
        .filter-bw { filter: grayscale(1); }
        .filter-vintage { filter: contrast(1.2) saturate(1.5) sepia(0.3) hue-rotate(-15deg); }
        .filter-neon { filter: saturate(2) hue-rotate(90deg) contrast(1.5); }

        /* FIX: Bingkai Landscape tidak terpotong */
        .cute-frame {
            position: absolute;
            /* Inset 0 & margin memastikan frame menempel tepi dalam layar dengan margin aman */
            inset: 0;
            margin: min(3vw, 20px);
            border: min(2vw, 12px) dotted var(--primary);
            border-radius: 24px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            background: radial-gradient(circle, transparent 70%, rgba(255, 105, 180, 0.1) 100%);
        }
        .cute-frame.active {
            opacity: 1;
            transform: scale(1);
        }

        .animated-emoji {
            position: absolute;
            font-size: clamp(2rem, 6vw, 4rem);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .e-1 { top: -2%; left: -2%; animation: float 3s ease-in-out infinite; }
        .e-2 { top: -2%; right: -2%; animation: float 3s ease-in-out infinite 1s; }
        .e-3 { bottom: -2%; left: -2%; animation: float 3s ease-in-out infinite 0.5s; }
        .e-4 { bottom: -2%; right: -2%; animation: float 3s ease-in-out infinite 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
        }

        .romantic-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 20px var(--primary);
            z-index: 30;
            pointer-events: none;
            padding: 20px;
            white-space: pre-line;
            line-height: 1.3;
        }

        #particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
        }
        .heart-particle {
            position: absolute;
            bottom: -10%;
            font-size: 2.5rem;
            animation: flyUp 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5) rotate(-20deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.8) rotate(45deg); opacity: 0; }
        }

        /* Minimalist Filter Icon (Kelingking) */
        .filter-fab {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            z-index: 100;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .filter-fab.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        .filter-fab:active {
            transform: scale(0.9);
            background: var(--primary);
        }

        .status {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: env(safe-area-inset-left, 20px);
            background: var(--surface);
            padding: 10px 20px;
            border-radius: 16px;
            font-weight: 600;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #eab308; transition: 0.3s;
        }

        .loader {
            position: absolute;
            inset: 0;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s;
            font-size: 1.2rem;
            gap: 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <span id="load-text">Membangunkan AI (Membutuhkan Internet)...</span>
    </div>

    <div class="container">
        <video class="input_video" autoplay playsinline></video>

        <div class="status">
            <div class="dot" id="dot"></div>
            <span id="status-text">Kalibrasi Kamera...</span>
        </div>

        <div class="cute-frame" id="cute-frame">
            <div class="animated-emoji e-1">🥰</div>
            <div class="animated-emoji e-2">✨</div>
            <div class="animated-emoji e-3">🌸</div>
            <div class="animated-emoji e-4">🦋</div>
        </div>

        <div class="romantic-text" id="romantic-text"></div>
        <div id="particles"></div>

        <!-- Ikon Filter Minimalis -->
        <div class="filter-fab" id="filter-fab" onclick="cycleFilter()">🎨</div>
    </div>

    <script>
        const video = document.querySelector('.input_video');
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');
        const loader = document.getElementById('loader');
        const cuteFrame = document.getElementById('cute-frame');
        const textOverlay = document.getElementById('romantic-text');
        const particles = document.getElementById('particles');
        const filterFab = document.getElementById('filter-fab');

        let isLoaded = false;
        
        // Zoom Engine
        let targetZoom = 1;
        let currentZoom = 1;

        // Filter Logic
        const filters = ['none', 'sepia', 'vintage', 'bw', 'neon'];
        let currentFilterIdx = 0;

        // Typing State
        let typeInterval = null;
        let isTyping = false;
        const msg = "i love you🤍🤍\nmanusia favorite kuuu.";

        // State & Buffer System untuk menekan sensitivitas
        let confirmedState = 'idle';
        const stateBuffer = [];
        const BUFFER_SIZE = 5; // Butuh 5 frame stabil untuk ganti state

        function getDist(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2 + (p1.z - p2.z)**2);
        }

        // Cek jari naik terhadap pergelangan tangan (wrist)
        function isFingerUp(lm, tipIdx, jointIdx) {
            return getDist(lm[tipIdx], lm[0]) > getDist(lm[jointIdx], lm[0]);
        }

        window.cycleFilter = function() {
            currentFilterIdx = (currentFilterIdx + 1) % filters.length;
            const activeFilter = filters[currentFilterIdx];
            
            // Clean up
            video.classList.remove('filter-sepia', 'filter-bw', 'filter-vintage', 'filter-neon');
            
            // Apply new
            if (activeFilter !== 'none') {
                video.classList.add(`filter-${activeFilter}`);
            }
        };

        function renderLoop() {
            currentZoom += (targetZoom - currentZoom) * 0.1;
            const z = Math.max(1, Math.min(currentZoom, 4));
            video.style.transform = `scaleX(-${z}) scaleY(${z})`;
            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);

        function spawnHeart() {
            const em = ['❤️', '🌸', '💖', '🥰', '✨'];
            const p = document.createElement('div');
            p.className = 'heart-particle';
            p.innerText = em[Math.floor(Math.random() * em.length)];
            p.style.left = `${Math.random() * 80 + 10}%`;
            p.style.fontSize = `${Math.random() * 1.5 + 2}rem`;
            particles.appendChild(p);
            setTimeout(() => p.remove(), 3500);
        }

        function applyState(state) {
            if (confirmedState === state) return;
            confirmedState = state;

            // Reset Default State
            cuteFrame.classList.remove('active');
            video.classList.remove('blur-active');
            filterFab.classList.remove('show');
            
            if (state !== 'one') {
                clearInterval(typeInterval);
                isTyping = false;
                textOverlay.innerHTML = '';
            }

            switch(state) {
                case 'idle':
                    statusText.innerText = "Memantau Gestur";
                    dot.style.background = "#22c55e"; // Hijau
                    break;
                case 'pinky':
                    statusText.innerText = "Filter Mode (Klik Ikon)";
                    dot.style.background = "#f59e0b"; // Kuning
                    filterFab.classList.add('show');
                    break;
                case 'two':
                    statusText.innerText = "2 Jari: Blur Aktif";
                    dot.style.background = "#64748b"; // Slate
                    video.classList.add('blur-active');
                    break;
                case 'five':
                    statusText.innerText = "5 Jari: Ceria!";
                    dot.style.background = "#a855f7"; // Ungu
                    cuteFrame.classList.add('active');
                    break;
                case 'one':
                    statusText.innerText = "1 Jari: Romantis";
                    dot.style.background = "#ef4444"; // Merah
                    video.classList.add('blur-active');
                    if (!isTyping) {
                        isTyping = true;
                        let i = 0;
                        typeInterval = setInterval(() => {
                            textOverlay.innerHTML = msg.substring(0, i).replace(/\n/g, '<br>');
                            i++;
                            if (i > msg.length) clearInterval(typeInterval);
                        }, 70);
                    }
                    break;
                case 'heart':
                    statusText.innerText = "Saranghae!";
                    dot.style.background = "#ec4899"; // Pink
                    for(let i=0; i<3; i++) setTimeout(spawnHeart, i*200);
                    break;
                case 'pinch':
                    statusText.innerText = "Zooming (Cubit)";
                    dot.style.background = "#3b82f6"; // Biru
                    break;
            }
        }

        function analyzeGestures(results) {
            if (!isLoaded) {
                isLoaded = true;
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }

            const hands = results.multiHandLandmarks;
            let rawState = 'idle';

            if (hands && hands.length > 0) {
                if (hands.length === 2) {
                    const dIdx = getDist(hands[0][8], hands[1][8]);
                    const dThumb = getDist(hands[0][4], hands[1][4]);
                    if (dIdx < 0.1 && dThumb < 0.1) rawState = 'heart';
                }

                if (rawState === 'idle') {
                    const lm = hands[0];
                    
                    const thumbUp = getDist(lm[4], lm[0]) > getDist(lm[2], lm[0]);
                    const indexUp = isFingerUp(lm, 8, 5);
                    const midUp = isFingerUp(lm, 12, 9);
                    const ringUp = isFingerUp(lm, 16, 13);
                    const pinkyUp = isFingerUp(lm, 20, 17);

                    const pinchDist = getDist(lm[4], lm[8]); 
                    
                    // Deteksi Kepalan Tangan (Semua jari turun)
                    const isFist = !indexUp && !midUp && !ringUp && !pinkyUp;

                    // 1. Kelingking (Pinky Up) untuk memunculkan ikon Filter
                    if (pinkyUp && !indexUp && !midUp && !ringUp) {
                        rawState = 'pinky';
                    }
                    // 2. 5 Jari Terbuka
                    else if (indexUp && midUp && ringUp && pinkyUp && thumbUp) {
                        rawState = 'five';
                    }
                    // 3. 2 Jari (Peace)
                    else if (indexUp && midUp && !ringUp && !pinkyUp) {
                        rawState = 'two';
                    }
                    // 4. 1 Jari (Telunjuk)
                    else if (indexUp && !midUp && !ringUp && !pinkyUp && !thumbUp) {
                        rawState = 'one';
                    }
                    // 5. Half Heart
                    else if (pinchDist < 0.03 && !midUp && !ringUp && !pinkyUp) {
                        rawState = 'heart';
                    }
                    // 6. Pinch Zoom: Syarat -> Jarak jempol-telunjuk < 0.15 DAN bukan mengepal (isFist == false)
                    // Ditambahkan !isFist untuk mencegah trigger saat mengepalkan tangan
                    else if (pinchDist >= 0.03 && pinchDist < 0.15 && !isFist) {
                        // Pastikan setidaknya jari tengah terbuka sedikit, atau kita abaikan jika murni kepal
                        if (!midUp && !ringUp) {
                            rawState = 'pinch';
                        }
                    }
                }

                // Eksekusi Kamera Zoom (Bypass Buffer agar pergerakan responsif)
                if (rawState === 'pinch') {
                    const pDist = getDist(hands[0][4], hands[0][8]);
                    // Map: Jarak dekat (0.03) = Zoom max (3.5). Jarak jauh (0.15) = Zoom min (1.0).
                    let mappedZoom = 3.5 - ((pDist - 0.03) * (2.5 / 0.12));
                    targetZoom = Math.max(1, Math.min(mappedZoom, 4)); 
                } else {
                    targetZoom = 1;
                }

                if (rawState === 'heart' && Math.random() > 0.7) spawnHeart();

            } else {
                targetZoom = 1; 
            }

            // Sistem Buffer/Debounce untuk mengurai false-positive/sensitivitas tinggi
            stateBuffer.push(rawState);
            if (stateBuffer.length > BUFFER_SIZE) stateBuffer.shift();

            // Jika semua history frame identik, baru ubah state
            const isStable = stateBuffer.every(val => val === rawState);
            
            if (isStable) {
                applyState(rawState);
            }
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, 
            minDetectionConfidence: 0.75, // Dinaikkan untuk presisi ketat
            minTrackingConfidence: 0.75
        });
        hands.onResults(analyzeGestures);

        const camera = new Camera(video, {
            onFrame: async () => await hands.send({image: video}),
            width: 1280, height: 720
        });

        camera.start().catch(e => {
            console.error(e);
            document.getElementById('load-text').innerText = "Izin Kamera Ditolak.";
            document.querySelector('.spinner').style.display = 'none';
        });
    </script>
</body>
</html>
