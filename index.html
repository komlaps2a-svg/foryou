<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Camera Blur</title>
    <!-- Memuat library MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Video dibalik secara horizontal seperti cermin */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.3s ease-in-out;
        }

        .blur-active {
            filter: blur(20px);
        }

        .status-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #eab308; /* Default Loading: Yellow */
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            z-index: 20;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loading-screen" id="loading">Memuat Model AI & Mengakses Kamera...</div>
        
        <div class="status-badge">
            <div class="indicator" id="indicator"></div>
            <span id="status-text">Inisialisasi...</span>
        </div>

        <video class="input_video" autoplay playsinline></video>
    </div>

    <script>
        const videoElement = document.querySelector('.input_video');
        const statusText = document.getElementById('status-text');
        const indicator = document.getElementById('indicator');
        const loadingScreen = document.getElementById('loading');

        let isModelLoaded = false;

        // Logika untuk memproses hasil deteksi landmark tangan
        function onResults(results) {
            // Sembunyikan layar loading saat frame pertama berhasil diproses
            if (!isModelLoaded) {
                isModelLoaded = true;
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            }

            let twoFingersDetected = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Ambil tangan pertama yang terdeteksi
                const landmarks = results.multiHandLandmarks[0];

                // Deteksi jari terangkat: Koordinat Y ujung jari lebih kecil (lebih tinggi di layar) dari sendi bawahnya.
                // Index 8 = Ujung Telunjuk, Index 6 = Sendi Telunjuk
                // Index 12 = Ujung Tengah, Index 10 = Sendi Tengah
                // Index 16 = Ujung Manis, Index 14 = Sendi Manis
                // Index 20 = Ujung Kelingking, Index 18 = Sendi Kelingking
                
                const isIndexUp = landmarks[8].y < landmarks[6].y;
                const isMiddleUp = landmarks[12].y < landmarks[10].y;
                const isRingDown = landmarks[16].y > landmarks[14].y;
                const isPinkyDown = landmarks[20].y > landmarks[18].y;

                // Syarat: Telunjuk dan Tengah NAIK, Manis dan Kelingking TURUN (Pose 'Peace'/2 Jari)
                if (isIndexUp && isMiddleUp && isRingDown && isPinkyDown) {
                    twoFingersDetected = true;
                }
            }

            // Manipulasi DOM berdasarkan deteksi
            if (twoFingersDetected) {
                videoElement.classList.add('blur-active');
                statusText.innerText = "2 Jari Terdeteksi (Blur ON)";
                indicator.style.backgroundColor = "#ef4444"; // Merah
            } else {
                videoElement.classList.remove('blur-active');
                statusText.innerText = "Kamera Normal";
                indicator.style.backgroundColor = "#22c55e"; // Hijau
            }
        }

        // Konfigurasi MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1, // Hanya melacak 1 tangan untuk efisiensi
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        // Inisialisasi Kamera dan kirim frame ke MediaPipe
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        // Jalankan
        camera.start().catch(err => {
            console.error("Gagal mengakses kamera:", err);
            loadingScreen.innerText = "Akses Kamera Ditolak / Tidak Ditemukan.";
            indicator.style.backgroundColor = "#ef4444";
        });
    </script>
</body>
</html>
